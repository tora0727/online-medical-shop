<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <title>Seller Centre</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <header class="topbar">
  <span id="shopTitle">ShopSphere - Seller Centre</span>
  <button class="logout hidden" id="logoutBtn">Logout</button>
 </header>

 <div class="container hidden" id="registerPage">
  <h2>Seller Registration</h2>
  <form id="registerForm" novalidate>
   <div class="form-group">
    <label for="rName">Owner Name</label>
    <input type="text" id="rName" placeholder="Enter your name">
    <span class="error" id="rNameError"></span>
   </div>
   <div class="form-group">
    <label for="rEmail">Email</label>
    <input type="text" id="rEmail" placeholder="Enter your email">
    <span class="error" id="rEmailError"></span>
   </div>
   <div class="form-group">
    <label for="rMobile">Mobile Number</label>
    <input type="text" id="rMobile" placeholder="01XXXXXXXXX">
    <span class="error" id="rMobileError"></span>
   </div>
   <div class="form-group">
    <label for="rPassword">Password</label>
    <input type="password" id="rPassword" placeholder="Enter your password">
    <span class="error" id="rPasswordError"></span>
   </div>
   <div class="form-group">
    <label for="rConfirm">Confirm Password</label>
    <input type="password" id="rConfirm" placeholder="Re-enter your password">
    <span class="error" id="rConfirmError"></span>
   </div>
   <button type="submit">Create Account</button>
  </form>
  <p class="result" id="registerResult"></p>
  <p class="link-text">Already a seller? <a href="#" id="toLogin">Login here</a></p>
 </div>

 <div class="container" id="loginPage">
  <h2>Seller Login</h2>
  <form id="loginForm" novalidate>
   <div class="form-group">
    <label for="lEmail">Email</label>
    <input type="text" id="lEmail" placeholder="Enter your email">
    <span class="error" id="lEmailError"></span>
   </div>
   <div class="form-group">
    <label for="lPassword">Password</label>
    <input type="password" id="lPassword" placeholder="Enter your password">
    <span class="error" id="lPasswordError"></span>
   </div>
   <button type="submit">Login</button>
  </form>
  <p class="result" id="loginResult"></p>
  <p class="link-text">New seller? <a href="#" id="toRegister">Create an account</a></p>
 </div>

 <div class="hidden" id="dashboardPage">
  <div class="container">
   <h2>Add New Product</h2>
   <form id="productForm" novalidate>
    <div class="form-group">
     <label for="pName">Product Name</label>
     <input type="text" id="pName" placeholder="Enter product name">
     <span class="error" id="pNameError"></span>
    </div>
    <div class="form-group">
     <label for="pCategory">Category</label>
     <select id="pCategory">
      <option value="">Select</option>
      <option value="Electronics">Electronics</option>
      <option value="Fashion">Fashion</option>
      <option value="Grocery">Grocery</option>
     </select>
     <span class="error" id="pCategoryError"></span>
    </div>
    <div class="form-group">
     <label for="pPrice">Price (BDT)</label>
     <input type="text" id="pPrice" placeholder="e.g. 1500">
     <span class="error" id="pPriceError"></span>
    </div>
    <div class="form-group">
     <label for="pStock">Stock Quantity</label>
     <input type="text" id="pStock" placeholder="0 to 1000">
     <span class="error" id="pStockError"></span>
    </div>
    <div class="form-group">
     <label>Condition</label>
     <div class="options">
      <label><input type="radio" name="condition" value="New"> New</label>
      <label><input type="radio" name="condition" value="Used"> Used</label>
     </div>
     <span class="error" id="conditionError"></span>
    </div>
    <div class="form-group">
     <label>Delivery (choose 1 to 3)</label>
     <div class="options">
      <label><input type="checkbox" name="delivery" value="Home"> Home</label>
      <label><input type="checkbox" name="delivery" value="Pickup"> Pickup</label>
      <label><input type="checkbox" name="delivery" value="Express"> Express</label>
     </div>
     <span class="error" id="deliveryError"></span>
    </div>
    <button type="submit">Add Product</button>
   </form>
   <p class="result" id="productResult"></p>
  </div>

  <div class="container wide">
   <h2>My Products</h2>
   <table>
    <thead>
     <tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Condition</th><th>Delivery</th></tr>
    </thead>
    <tbody id="productBody"></tbody>
   </table>
  </div>
 </div>

 <script src="script.js"></script>
</body>
</html>
